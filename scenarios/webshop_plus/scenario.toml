# WebShop+ Scenario Configuration
#
# This file defines the WebShop+ benchmark scenario for the AgentBeats platform.
# WebShop+ evaluates shopping agents on five key capabilities:
# - Budget management and multi-item purchasing
# - Preference memory across sessions
# - Negative constraint satisfaction
# - Comparative reasoning and product selection
# - Error identification and recovery

[scenario]
name = "webshop-plus"
version = "1.0.0"
description = "Evaluates shopping agents on budget management, preference memory, constraint satisfaction, comparative reasoning, and error recovery."

[scenario.metadata]
author = "AgentBeats"
category = "shopping"
tags = ["e-commerce", "shopping", "evaluation", "benchmark"]
homepage = "https://github.com/mpnikhil/agentbeats"

# Green agent (evaluator) configuration
[agents.green]
name = "webshop-plus-evaluator"
description = "WebShop+ green agent that orchestrates assessments and evaluates shopping agents."
image = "ghcr.io/mpnikhil/webshop-plus-green:latest"
port = 8000

[agents.green.card]
url = "http://localhost:8000/.well-known/agent-card.json"

[agents.green.skills]
shopping_assessment = "Evaluates shopping agents on WebShop+ tasks"

[agents.green.environment]
LLM_MODEL = "openai/qwen3-coder-30b-a3b-instruct-mlx"
LLM_TEMPERATURE = "0.2"
LLM_MAX_TOKENS = "4096"

# Purple agent (baseline shopper) configuration
[agents.purple]
name = "webshop-plus-shopper"
description = "Baseline shopping agent that navigates WebShop to find and purchase products."
image = "ghcr.io/mpnikhil/webshop-plus-purple:latest"
port = 8001

[agents.purple.card]
url = "http://localhost:8001/.well-known/agent-card.json"

[agents.purple.skills]
shopping = "Searches for and purchases products based on instructions"

[agents.purple.environment]
LLM_MODEL = "openai/qwen3-coder-30b-a3b-instruct-mlx"
LLM_TEMPERATURE = "0.2"
LLM_MAX_TOKENS = "2048"

# Task configuration
[tasks]
total = 80

# Task types and their distributions
[tasks.types.budget_constrained]
count = 20
description = "Tests budget management and multi-item purchasing"
difficulty_distribution = { easy = 5, medium = 10, hard = 5 }

[tasks.types.preference_memory]
count = 15
description = "Tests preference recall across sessions"
difficulty_distribution = { easy = 5, medium = 5, hard = 5 }

[tasks.types.negative_constraint]
count = 20
description = "Tests constraint satisfaction with forbidden attributes"
difficulty_distribution = { easy = 5, medium = 10, hard = 5 }

[tasks.types.comparative_reasoning]
count = 15
description = "Tests product comparison and justification"
difficulty_distribution = { easy = 5, medium = 5, hard = 5 }

[tasks.types.error_recovery]
count = 10
description = "Tests error identification and correction"
difficulty_distribution = { easy = 3, medium = 4, hard = 3 }

# Evaluation configuration
[evaluation]
max_actions_per_task = 30
task_timeout_seconds = 300
action_timeout_seconds = 60
use_llm_evaluation = true

[evaluation.scoring]
# Weights for aggregate scoring
budget_weight = 0.3
completion_weight = 0.4
quality_weight = 0.3

# Assessment presets
[presets.quick]
description = "Quick test with 3 tasks"
num_tasks = 3
task_types = ["budget_constrained", "negative_constraint", "error_recovery"]
timeout_per_task = 180

[presets.standard]
description = "Standard assessment with 20 tasks"
num_tasks = 20
task_types = ["all"]
timeout_per_task = 300

[presets.full]
description = "Full assessment with all 80 tasks"
num_tasks = 80
task_types = ["all"]
timeout_per_task = 300

[presets.memory]
description = "Preference memory focused assessment"
num_tasks = 15
task_types = ["preference_memory"]
timeout_per_task = 300

# Local development configuration
[local]
green_port = 8000
purple_port = 8001
webshop_mode = "preview"

[local.lmstudio]
model = "qwen3-coder-30b-a3b-instruct-mlx"
base_url = "http://localhost:1234/v1"

# Docker compose configuration hints
[docker]
network = "webshop-plus-network"
volumes = ["./data:/app/data"]

[docker.healthcheck]
interval = "10s"
timeout = "5s"
retries = 3
start_period = "30s"
