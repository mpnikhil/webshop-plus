[project]
name = "webshop-plus-green"
version = "1.0.0"
description = "WebShop+ Green Agent - Evaluates shopping agents on budget management, preference memory, constraint satisfaction, comparative reasoning, and error recovery"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "jsonschema>=4.17.0",
    "flask>=3.1.2",
    "gym>=0.26.2",
    "numpy<2",
    "thefuzz>=0.22.1",
    "rank-bm25>=0.2.2",
    "torch>=2.9.1",
    "cleantext>=1.1.4",
    "rich>=14.2.0",
    "tqdm>=4.67.1",
    "beautifulsoup4>=4.14.3",
    "a2a-sdk[http-server]>=0.3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
    "mypy>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[dependency-groups]
dev = [
    "gdown>=5.2.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
]
